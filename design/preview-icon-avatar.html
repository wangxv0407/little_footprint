<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小脚印成长记 · 图标与头像预览</title>
<style>
  :root{
    --paper:#FBF8F3; --card:#FFFFFF; --line:#EDE5D8;
    --ink:#2B2724; --ink2:#7C7369; --ink3:#B3A99D;
    --clay:#BF5B3B; --clayl:#F7E8E1; --pine:#2E5245; --gold:#D9A34E;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:48px 40px 80px; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto}
  h1{
    font-family:Georgia,"Songti SC",serif; font-size:26px; font-weight:600;
    letter-spacing:.5px; margin:0 0 6px;
  }
  .sub{color:var(--ink2);font-size:13px;line-height:1.8;margin-bottom:40px}
  h2{
    font-size:13px;font-weight:600;letter-spacing:2px;color:var(--ink2);
    text-transform:uppercase;margin:44px 0 18px;
    padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end}
  figure{margin:0;text-align:center}
  figcaption{font-size:11.5px;color:var(--ink3);margin-top:9px;letter-spacing:.3px}
  img{display:block}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px;margin-bottom:16px;
  }

  /* 图标 */
  .main-icon img{width:168px;border-radius:38px;box-shadow:0 12px 30px rgba(122,66,44,.20)}
  .circle-mask{border-radius:50%;overflow:hidden;box-shadow:0 10px 24px rgba(122,66,44,.18)}
  .squircle{border-radius:30%;overflow:hidden;box-shadow:0 10px 24px rgba(122,66,44,.18)}
  .round-mask{width:168px;height:168px}
  .round-mask img{width:100%;height:100%}

  .sizes{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
  .sizes figure{border-radius:22%;overflow:hidden}

  /* 自适应图标合成 */
  .adaptive{
    position:relative;width:168px;height:168px;overflow:hidden;
    box-shadow:0 10px 24px rgba(122,66,44,.18);
  }
  .adaptive img{position:absolute;inset:0;width:100%;height:100%}
  .adaptive.circle{border-radius:50%}
  .adaptive.square{border-radius:46px}
  .adaptive.droplet{border-radius:50% 50% 50% 6%}

  .dark{background:#1C1B1A;border-radius:20px;padding:26px;display:flex;gap:26px;align-items:flex-end}

  /* 头像 */
  .avatars{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end}
  .avatar{border-radius:28%;overflow:hidden;display:block}
  .avatar.r16{border-radius:16px}
  .avatar.r12{border-radius:12px}

  .note{
    font-size:12.5px;color:var(--ink2);line-height:1.9;
    background:var(--clayl);border-left:3px solid var(--clay);
    padding:14px 18px;border-radius:0 10px 10px 0;margin-top:22px;
  }
  .note b{color:var(--ink)}
  .tag{
    display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.6px;
    padding:3px 9px;border-radius:999px;background:var(--clayl);color:var(--clay);
    margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>小脚印成长记 · 视觉预览</h1>
  <div class="sub">
    本次改动两处：应用图标（此前 Manifest 未声明 <code>android:icon</code>，手机上一直是系统默认图标）、
    宝宝默认头像（此前用文字首字兜底，缺字体会渲染成异常符号）。
  </div>

  <h2>二、宝宝默认头像</h2>

  <div class="card">
    <span class="tag">三种配色（按性别）</span>
    <div class="avatars" id="avatars"></div>
    <div class="note">
      默认头像用矢量图形绘制，<b>不依赖任何字体</b>，因此不会再出现问号或方框。
      有照片时优先显示照片；性别只影响点缀色（陶土 / 松绿 / 藕粉）。
    </div>
  </div>

</div>

<script>
// 与 Flutter 端 _BabyFacePainter 完全一致的绘制参数（画布 100×100）
function avatarSVG(bg, accent, r){
  const cx = 50, faceCy = 56, faceR = 29;
  return `
<svg viewBox="0 0 100 100" class="avatar ${r}" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="${bg}"/>
  <!-- 胎毛：先画，被脸盖住根部 -->
  <path d="M43 31 Q51 13 57 31" stroke="${accent}" stroke-width="5.2"
        fill="none" stroke-linecap="round"/>
  <!-- 脸 -->
  <circle cx="${cx}" cy="${faceCy}" r="${faceR}" fill="#FFFDFB"/>
  <!-- 腮红：叠在脸上 -->
  <circle cx="${cx-16}" cy="69" r="7" fill="${accent}" opacity="0.20"/>
  <circle cx="${cx+16}" cy="69" r="7" fill="${accent}" opacity="0.20"/>
  <!-- 眼睛 -->
  <circle cx="${cx-10.5}" cy="58.5" r="4.2" fill="#2B2724"/>
  <circle cx="${cx+10.5}" cy="58.5" r="4.2" fill="#2B2724"/>
  <!-- 微笑 -->
  <path d="M42.8 67.8 Q50 74.5 57.2 67.8" stroke="#2B2724" stroke-width="3.4"
        fill="none" stroke-linecap="round"/>
</svg>`;
}

const palettes = [
  { name:'未填性别', bg:'#F7E8E1', accent:'#BF5B3B' },
  { name:'男孩',     bg:'#E4EDE7', accent:'#2E5245' },
  { name:'女孩',     bg:'#FAE7EC', accent:'#C4788F' },
];

const sizes = [
  { px:88, r:'',    label:'建档页 88' },
  { px:54, r:'r16', label:'我的页 54' },
  { px:40, r:'r12', label:'切换列表 40' },
];

const host = document.getElementById('avatars');
for (const p of palettes){
  const col = document.createElement('div');
  col.style.cssText = 'display:flex;flex-direction:column;gap:20px';
  const head = document.createElement('div');
  head.textContent = p.name;
  head.style.cssText = 'font-size:12px;color:#7C7369;font-weight:600;letter-spacing:.5px';
  col.appendChild(head);

  const rowEl = document.createElement('div');
  rowEl.style.cssText = 'display:flex;gap:24px;align-items:flex-end';
  for (const s of sizes){
    const fig = document.createElement('figure');
    fig.innerHTML = avatarSVG(p.bg, p.accent, s.r).replace('width="100" height="100"',
      `width="${s.px}" height="${s.px}"`);
    const cap = document.createElement('figcaption');
    cap.textContent = s.label;
    fig.appendChild(cap);
    rowEl.appendChild(fig);
  }
  col.appendChild(rowEl);
  host.appendChild(col);
}
</script>
