name: Build APK

# 在推送到 main 分支、或手动触发时运行
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # 与本地开发环境保持一致（3.29.3 / Dart 3.7.2），
          # 依赖已用区间约束兼容更高版本，后续可平滑升级。
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 同步传输层回归：真实 TCP 回环，验证 JSON 行/二进制分帧与跨分片解码
      - name: Channel loopback probe
        run: dart run tool/channel_loopback_probe.dart

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      # 构建失败时把完整日志留成 artifact，方便定位 Gradle/NDK 类问题
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # 先把产物传上去，避免后面的校验步骤出问题把 APK 卡掉
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-footprint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 打印实际签名指纹，用于核对「能否覆盖安装」。
      # apksigner 输出的 SHA-256 是不带冒号的小写串，keytool 带冒号，
      # 所以统一去掉冒号再比。
      # 定位不到 apksigner 时只告警不阻断，避免把产物卡住。
      - name: Verify APK signature
        shell: bash
        run: |
          set -u
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED="7c67d729f9da1997a7eadbb0225d97b433bddac9c94d5ab6d752112e5c36f3e3"

          APKSIGNER=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -z "$root" ] || [ ! -d "$root" ]; then continue; fi
            APKSIGNER=$(find "$root" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$APKSIGNER" ]; then break; fi
          done

          if [ -z "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验"
            exit 0
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" || true

          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
            | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' \
            | tr -d ':' | tr 'A-Z' 'a-z' || true)
          echo "实际 SHA-256（无冒号）: ${ACTUAL:-<未取到>}"
          if [ -z "$ACTUAL" ]; then
            echo "::warning::未能解析签名指纹，请人工确认"
          elif [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不匹配，实际=${ACTUAL}"
            exit 1
          else
            echo "::notice::签名指纹校验通过（${ACTUAL}），可覆盖安装"
          fi
