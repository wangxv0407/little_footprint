name: little_footprint
description: 小脚印成长记 - 本地优先、局域网同步的宝宝成长记录App（仅夫妻双机，安卓）。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 本地数据库与文件路径
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # 工具
  uuid: ^4.4.2
  crypto: ^3.0.5
  # intl 由 flutter_localizations 钉版本：3.29 → 0.19.0，3.44 → 0.20.x
  # 用区间约束让本地与 CI 都能解析
  intl: '>=0.19.0 <0.21.0'
  archive: ^3.6.1
  image: ^4.2.0

  # 媒体
  image_picker: ^1.1.2
  # record 7.x 要求 Dart >=3.12（Flutter 3.44+），本地 3.29.3 无法解析；
  # 6.x 在 3.29 与 3.44 上均可用，锁定 6.x 保持本地与 CI 一致。
  record: ^6.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.1
  chewie: ^1.8.1
  photo_view: ^0.15.0

  # 权限
  permission_handler: ^11.3.1

  # 网络（局域网）
  network_info_plus: ^5.0.3

  # 图表（成长曲线）
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
